name: sonata
description: A fast, offline-first music player for Linux.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.7
  ffi: ^2.1.3
  just_audio: ^0.9.42
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1

flutter:
  uses-material-design: true
